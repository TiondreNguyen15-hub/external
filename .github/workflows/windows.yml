name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S apex-visualizer -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test projection
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package portable Windows application
        run: cpack --config build/CPackConfig.cmake -C Release -B dist
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: ApexVisualizer-Windows-x64
          path: dist/ApexVisualizer-Windows-x64.zip
          if-no-files-found: error
